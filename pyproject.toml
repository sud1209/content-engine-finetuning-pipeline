[project]
name = "content-engine-finetuning-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39",
    "pydantic>=2.9",
    "datasets>=3.1",
    "huggingface-hub>=0.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "scipy>=1.14",
    "kaleido>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.54",
    "slowapi>=0.1.9",
    "transformers>=4.46",
    "accelerate>=1.1",
    "peft>=0.13",
    "trl>=0.12",
    "bitsandbytes>=0.44",
    "wandb>=0.18",
    "optuna>=3.6",
    "llama-cpp-python>=0.3",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
